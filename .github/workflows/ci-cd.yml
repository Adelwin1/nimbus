name: Nimbus pre-deployment checks

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: nimbus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

jobs:
  backend:
    name: Backend Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus_test_password
          POSTGRES_DB: nimbus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nimbus -d nimbus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgres://nimbus:nimbus_test_password@localhost:5432/nimbus_test?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: |
          unformatted="$(
            gofmt -l \
              $(find . -type f -name '*.go' -not -path './vendor/*')
          )"

          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run production migrations against test database
        env:
          DATABASE_URL: postgres://nimbus:nimbus_test_password@localhost:5432/nimbus_test?sslmode=disable
          MIGRATIONS_DIR: migrations
        run: go run ./cmd/migrate

      - name: Run backend tests
        run: go test -count=1 ./...

      - name: Run race detector
        run: go test -race -count=1 ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build API binaries
        run: |
          go build -trimpath -o /tmp/nimbus-api ./cmd/api
          go build -trimpath -o /tmp/nimbus-migrate ./cmd/migrate

      - name: Build backend container
        working-directory: .
        run: |
          docker build \
            --tag "nimbus-api:${GITHUB_SHA}" \
            ./backend

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

  browser-and-repairs:
    name: Browser and Repair Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser-worker/package-lock.json
      - name: Install browser worker
        working-directory: browser-worker
        run: npm ci
      - name: Install Chromium
        working-directory: browser-worker
        run: npx playwright install --with-deps chromium
      - name: Test passing and failing browser journeys
        working-directory: browser-worker
        run: npm test
      - name: Test repair proposal and verification tools
        run: node --test repair-tools/*.test.cjs
      - name: Test repository execution policy
        run: node --test code-worker/runner.test.cjs hosted-workers/*.test.cjs
      - name: Pull Node execution image
        run: docker pull node:24-bookworm-slim
      - name: Test real isolated repository execution
        run: node --test code-worker/runner.integration.test.cjs

  quality-gate:
    name: Nimbus Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, frontend, browser-and-repairs]
    steps:
      - name: Require all checks to pass
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER: ${{ needs.browser-and-repairs.result }}
        run: |
          test "$BACKEND" = success
          test "$FRONTEND" = success
          test "$BROWSER" = success
